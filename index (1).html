<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Dziennik: dieta i siłownia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#E8EBF1;--card:#F7F8FB;--ink:#17203A;--mut:#5C6580;--line:#CBD0DE;--acc:#E8480C;--acc-ink:#fff;--ok:#1F7A4D;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10131C;--card:#191E2B;--ink:#EAEDF6;--mut:#9099B3;--line:#2B3245;--acc:#FF6B35;--acc-ink:#10131C;--ok:#4CC38A;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10131C;--card:#191E2B;--ink:#EAEDF6;--mut:#9099B3;--line:#2B3245;--acc:#FF6B35;--acc-ink:#10131C;--ok:#4CC38A;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 Barlow,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-text-size-adjust:100%}
main{max-width:560px;margin:0 auto;padding:16px 16px 96px}
h1,h2,.num{font-family:"Barlow Condensed","Arial Narrow",Impact,sans-serif;font-weight:700;letter-spacing:.01em;margin:0}
h2{font-size:22px;margin:22px 0 10px}
.daynav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.daynav h1{font-size:30px;text-transform:none;text-align:center;flex:1;line-height:1.05}
.daynav small{display:block;font:500 14px Barlow,sans-serif;color:var(--mut);margin-top:2px}
button{font:inherit;color:inherit;cursor:pointer}
.ic{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:12px}
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.hero .num{font-size:64px;line-height:.9}
.hero .of{color:var(--mut);font-size:15px;text-align:right}
.bar{height:12px;border-radius:6px;background:var(--line);overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;background:var(--acc);border-radius:6px}
.bar.over i{background:var(--ok)}
.macros{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px;text-align:center}
.macros b{display:block;font:700 24px "Barlow Condensed",sans-serif}
.macros span{font-size:13px;color:var(--mut)}
form{display:grid;gap:8px}
.row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
label{font-size:13px;color:var(--mut);display:grid;gap:3px}
input,select{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 11px;min-height:44px}
input:focus-visible,button:focus-visible,select:focus-visible{outline:3px solid var(--acc);outline-offset:1px}
.go{background:var(--acc);color:var(--acc-ink);border:0;border-radius:10px;min-height:46px;font-weight:600}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item p{margin:0}
.item .sub{font-size:13px;color:var(--mut)}
.del{border:0;background:none;color:var(--mut);font-size:22px;width:44px;height:44px;flex:none}
.hint{font-size:14px;color:var(--mut);margin:0}
.hint button{border:0;background:none;color:var(--acc);font-weight:600;padding:0;text-decoration:underline}
.empty{color:var(--mut);margin:6px 0 0}
nav{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(6,1fr);background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{border:0;background:none;padding:14px 1px;font:700 15px "Barlow Condensed",sans-serif;color:var(--mut);border-top:3px solid transparent}
nav button[aria-current="page"]{color:var(--ink);border-top-color:var(--acc)}
svg.ch{width:100%;height:auto;display:block;margin-top:8px}
.ch text{fill:var(--mut);font:12px Barlow,sans-serif}
.ch .ln{stroke:var(--acc);stroke-width:2.5;fill:none;stroke-linejoin:round}
.ch .dt{fill:var(--acc)}
.ch .gr{stroke:var(--line);stroke-width:1}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stats b{display:block;font:700 28px "Barlow Condensed",sans-serif}
.stats span{font-size:13px;color:var(--mut)}
.goals{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:end}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mh{display:flex;align-items:center;gap:10px}
.mh b{font:700 21px "Barlow Condensed",sans-serif}
.mh span{flex:1;color:var(--mut);font-size:14px}
.mini{border:1px solid var(--line);background:var(--bg);border-radius:20px;min-height:40px;padding:0 14px;font-weight:600}
body.kb nav{display:none}
body.kb main{padding-bottom:24px}
.chips{display:flex;gap:8px;margin-top:14px}
.chips button{flex:1;min-height:44px;border-radius:22px;border:1px solid var(--line);background:var(--card);font-weight:600}
.chips button[aria-pressed="true"]{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.rc h3{font:700 22px "Barlow Condensed",sans-serif;margin:0}
.rc .sub{font-size:14px;color:var(--mut);margin:4px 0;white-space:pre-line}
.rc .ing{margin:8px 0 4px}
.exb{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 12px;min-height:44px;display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;margin-top:8px}
.exb span{color:var(--mut);font-size:14px}
.chk{flex:1;display:flex;align-items:center;gap:12px;min-height:48px;text-align:left;border:0;background:none;padding:6px 0}
.box{width:28px;height:28px;border-radius:8px;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-weight:700}
.chk.on .box{background:var(--ok);border-color:var(--ok);color:var(--acc-ink)}
.chips.wrap{flex-wrap:wrap}
.chips.wrap button{flex:none;padding:0 14px}
textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 11px;resize:vertical}
textarea:focus-visible{outline:3px solid var(--acc);outline-offset:1px}
</style>
</head>
<body>
<main id="app"></main>
<nav id="nav">
  <button data-v="diet">Dieta</button>
  <button data-v="rec">Przepisy</button>
  <button data-v="train">Trening</button>
  <button data-v="sleep">Zdrowie</button>
  <button data-v="prog">Postępy</button>
  <button data-v="me">Profil</button>
</nav>
<script>
var K='dziennik-v1',S=null,mem=null;
try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
S=S||mem||{goals:{k:2200,p:150},meals:[],sets:[],weights:[]};
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){mem=S}}
function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
var TODAY=ymd(new Date()),cur=TODAY,view='diet',pe='';
var BASE=['Wyciskanie leżąc','Przysiad ze sztangą','Martwy ciąg','Wyciskanie nad głowę','Podciąganie','Wiosłowanie sztangą','Dipy','Uginanie ramion','Wyciskanie na skosie','Wypychanie na suwnicy','Martwy ciąg rumuński','Wspięcia na palce'];
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function shift(n){var d=new Date(cur+'T12:00');d.setDate(d.getDate()+n);cur=ymd(d);render()}
function dlabel(d){return new Date(d+'T12:00').toLocaleDateString('pl-PL',{day:'numeric',month:'short'})}
function head(){
  var d=new Date(cur+'T12:00'),t=d.toLocaleDateString('pl-PL',{weekday:'long'}),s=d.toLocaleDateString('pl-PL',{day:'numeric',month:'long',year:'numeric'});
  return '<div class="daynav"><button class="ic" onclick="shift(-1)" aria-label="Poprzedni dzień">‹</button><h1>'+(cur===TODAY?'Dziś':t)+'<small>'+s+'</small></h1><button class="ic" onclick="shift(1)" aria-label="Następny dzień">›</button></div>';
}
function sum(a,k){return a.reduce(function(s,x){return s+(+x[k]||0)},0)}
function num(v){return v===''||v==null?0:parseFloat(String(v).replace(',','.'))||0}

function diet(){return diet0()+supps()}
function diet0(){
  var m=S.meals.filter(function(x){return x.d===cur}),k=sum(m,'k'),g=S.goals,pct=Math.min(100,g.k?k/g.k*100:0),left=g.k-k;
  var h=head();
  h+='<div class="card"><div class="hero"><div class="num">'+Math.round(k)+'</div><div class="of">z '+g.k+' kcal<br>'+(left>=0?'zostało '+Math.round(left):'ponad o '+Math.round(-left))+'</div></div><div class="bar"><i style="width:'+pct+'%"></i></div>';
  h+='<div class="macros"><div><b>'+Math.round(sum(m,'p'))+' g</b><span>białko (cel '+g.p+')</span></div><div><b>'+Math.round(sum(m,'c'))+' g</b><span>węglowodany</span></div><div><b>'+Math.round(sum(m,'f'))+' g</b><span>tłuszcze</span></div></div></div>';
  h+='<h2>Dodaj posiłek</h2><form id="mf" class="card" onsubmit="addMeal(event)" style="margin-top:0"><label>Nazwa<input name="n" required placeholder="np. owsianka z bananem" autocomplete="off"></label><label>Posiłek<select name="t">'+mealOpts()+'</select></label><div class="row"><label>kcal<input name="k" inputmode="decimal" required></label><label>Białko g<input name="p" inputmode="decimal"></label><label>Węgl. g<input name="c" inputmode="decimal"></label><label>Tłuszcz g<input name="f" inputmode="decimal"></label></div><button class="go">Dodaj posiłek</button></form>';
  h+='<h2>Posiłki</h2>'+mealSections(m);
  var rec=[],seen={};S.meals.slice().reverse().forEach(function(x){if(!seen[x.n]&&rec.length<6){seen[x.n]=1;rec.push(x)}});
  if(rec.length){h+='<h2>Szybko dodaj ponownie</h2><div class="card" style="margin-top:0">';rec.forEach(function(x){h+='<div class="item"><div><p>'+esc(x.n)+'</p><p class="sub">'+Math.round(x.k)+' kcal · B '+Math.round(x.p)+'</p></div><button class="go" style="padding:0 16px" onclick="reMeal('+x.id+')">Dodaj</button></div>'});h+='</div>'}
  h+='<h2>Cele dzienne</h2><form class="card goals" style="margin-top:0" onsubmit="setGoals(event)"><label>kcal<input name="k" inputmode="numeric" value="'+g.k+'"></label><label>Białko g<input name="p" inputmode="numeric" value="'+g.p+'"></label><button class="go" style="padding:0 16px">Zapisz</button></form>';
  return h;
}
function addMeal(e){e.preventDefault();var f=e.target;mt=f.t.value;S.meals.push({id:Date.now(),d:cur,t:mt,n:f.n.value.trim(),k:num(f.k.value),p:num(f.p.value),c:num(f.c.value),f:num(f.f.value)});save();render()}
function reMeal(id){var x=S.meals.filter(function(m){return m.id===id})[0];if(!x)return;S.meals.push({id:Date.now(),d:cur,t:x.t||mt,n:x.n,k:x.k,p:x.p,c:x.c,f:x.f});save();render()}
function delMeal(id){S.meals=S.meals.filter(function(m){return m.id!==id});save();render()}
function setGoals(e){e.preventDefault();var f=e.target;S.goals={k:num(f.k.value)||S.goals.k,p:num(f.p.value)||S.goals.p};save();render()}

function exNames(){var u={};S.sets.forEach(function(x){u[x.e]=1});BASE.forEach(function(b){u[b]=1});(S.myex||[]).forEach(function(x){u[x.n]=1});Object.keys(EXL).forEach(function(k){EXL[k].split(',').forEach(function(n){u[n]=1})});return Object.keys(u).sort()}
function lastOf(e){var l=S.sets.filter(function(x){return x.e.toLowerCase()===e.toLowerCase()&&x.d<cur}).sort(function(a,b){return a.d<b.d?1:a.d>b.d?-1:b.id-a.id});return l[0]}
function train(){return train0()+plans()}
function train0(){
  var t=S.sets.filter(function(x){return x.d===cur}),h=head();
  h+='<h2>Dodaj serię</h2><form class="card" style="margin-top:0" onsubmit="addSet(event)"><label>Ćwiczenie<input name="e" list="exl" required value="'+esc(pe)+'" oninput="hintEx(this.value)" autocomplete="off" placeholder="np. Przysiad ze sztangą"></label><datalist id="exl">'+exNames().map(function(n){return'<option value="'+esc(n)+'">'}).join('')+'</datalist><p class="hint" id="hint"></p><div class="row3"><label>Ciężar kg<input name="kg" inputmode="decimal" required></label><label>Powtórzenia<input name="r" inputmode="numeric" required></label><label>Serie<input name="s" inputmode="numeric" value="1"></label></div><button class="go">Zapisz serię</button></form>';
  h+='<h2>Dzisiejszy trening</h2><div class="card" style="margin-top:0">';
  if(!t.length)h+='<p class="empty">Nic jeszcze nie zapisano.</p>';
  t.forEach(function(x){h+='<div class="item"><div><p>'+esc(x.e)+'</p><p class="sub">'+x.kg+' kg × '+x.r+' powt. × '+x.s+' '+(x.s==1?'seria':'serie')+'</p></div><button class="del" onclick="delSet('+x.id+')" aria-label="Usuń serię">×</button></div>'});
  if(t.length)h+='<p class="hint" style="margin-top:8px">Objętość: '+Math.round(t.reduce(function(s,x){return s+x.kg*x.r*x.s},0)).toLocaleString('pl-PL')+' kg</p>';
  h+='</div>';
  return h;
}
function hintEx(v){var el=document.getElementById('hint');if(!el)return;pe=v;var l=v.trim()?lastOf(v.trim()):null;
  if(!l){el.innerHTML='';return}
  el.innerHTML='Ostatnio ('+dlabel(l.d)+'): '+l.kg+' kg × '+l.r+' × '+l.s+' <button type="button" onclick="fillEx()">użyj</button>';
}
function fillEx(){var f=document.querySelector('form input[name=e]').form,l=lastOf(f.e.value.trim());if(!l)return;f.kg.value=l.kg;f.r.value=l.r;f.s.value=l.s}
function addSet(e){e.preventDefault();var f=e.target;S.sets.push({id:Date.now(),d:cur,e:f.e.value.trim(),kg:num(f.kg.value),r:Math.round(num(f.r.value)),s:Math.max(1,Math.round(num(f.s.value)))});pe=f.e.value.trim();save();render()}
function delSet(id){S.sets=S.sets.filter(function(x){return x.id!==id});save();render()}

function chart(pts,unit){
  if(pts.length<2)return '<p class="empty">Potrzeba co najmniej dwóch pomiarów, żeby narysować wykres.</p>';
  var W=320,H=150,P=30,ys=pts.map(function(p){return p.y}),lo=Math.min.apply(0,ys),hi=Math.max.apply(0,ys);
  if(hi===lo){hi+=1;lo-=1}
  var x=function(i){return P+i*(W-P-10)/(pts.length-1)},y=function(v){return H-24-(v-lo)/(hi-lo)*(H-44)};
  var s='<svg class="ch" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Wykres"><line class="gr" x1="'+P+'" x2="'+(W-10)+'" y1="'+y(hi)+'" y2="'+y(hi)+'"/><line class="gr" x1="'+P+'" x2="'+(W-10)+'" y1="'+y(lo)+'" y2="'+y(lo)+'"/>';
  s+='<text x="0" y="'+(y(hi)+4)+'">'+(+hi.toFixed(1))+'</text><text x="0" y="'+(y(lo)+4)+'">'+(+lo.toFixed(1))+'</text>';
  s+='<polyline class="ln" points="'+pts.map(function(p,i){return x(i)+','+y(p.y)}).join(' ')+'"/>';
  pts.forEach(function(p,i){s+='<circle class="dt" cx="'+x(i)+'" cy="'+y(p.y)+'" r="3.5"/>'});
  s+='<text x="'+P+'" y="'+(H-4)+'">'+dlabel(pts[0].d)+'</text><text x="'+(W-10)+'" y="'+(H-4)+'" text-anchor="end">'+dlabel(pts[pts.length-1].d)+'</text></svg>';
  return s;
}
var pex='';
function prog(){
  var w=S.weights.slice().sort(function(a,b){return a.d<b.d?-1:1}),h='<div class="daynav"><h1>Postępy</h1></div>';
  var wk=[];for(var i=0;i<7;i++){var d=new Date(TODAY+'T12:00');d.setDate(d.getDate()-i);wk.push(ymd(d))}
  var dd=wk.filter(function(d){return S.meals.some(function(m){return m.d===d})}),kc=dd.length?Math.round(S.meals.filter(function(m){return wk.indexOf(m.d)>-1}).reduce(function(s,m){return s+m.k},0)/dd.length):0;
  var tr=wk.filter(function(d){return S.sets.some(function(x){return x.d===d})}).length;
  h+='<div class="card stats"><div><b>'+(kc||'–')+'</b><span>średnie kcal / dzień (7 dni)</span></div><div><b>'+tr+'</b><span>dni z treningiem (7 dni)</span></div></div>';
  h+='<h2>Waga ciała</h2><form class="card goals" style="margin-top:0" onsubmit="addW(event)"><label>Waga kg<input name="kg" inputmode="decimal" required></label><label>Data<input name="d" type="date" value="'+TODAY+'"></label><button class="go" style="padding:0 16px">Zapisz</button></form>';
  h+='<div class="card">'+(w.length?'<div class="stats"><div><b>'+w[w.length-1].kg+' kg</b><span>ostatni pomiar</span></div><div><b>'+(w.length>1?((w[w.length-1].kg-w[0].kg>0?'+':'')+(+(w[w.length-1].kg-w[0].kg).toFixed(1))+' kg'):'–')+'</b><span>zmiana od początku</span></div></div>':'')+chart(w.map(function(x){return{d:x.d,y:x.kg}}))+'</div>';
  var ex=exNames().filter(function(n){return S.sets.some(function(x){return x.e===n})});
  h+='<h2>Siła</h2><div class="card" style="margin-top:0">';
  if(!ex.length)h+='<p class="empty">Zapisz pierwsze serie w zakładce Trening, a tu pojawi się wykres.</p>';
  else{if(ex.indexOf(pex)<0)pex=ex[0];
    h+='<label>Ćwiczenie<select onchange="pex=this.value;render()">'+ex.map(function(n){return'<option'+(n===pex?' selected':'')+'>'+esc(n)+'</option>'}).join('')+'</select></label>';
    var by={};S.sets.filter(function(x){return x.e===pex}).forEach(function(x){by[x.d]=Math.max(by[x.d]||0,x.kg)});
    var pts=Object.keys(by).sort().map(function(d){return{d:d,y:by[d]}});
    h+='<p class="hint" style="margin-top:8px">Najcięższa seria w danym dniu (kg)</p>'+chart(pts);
    if(pts.length)h+='<p class="hint">Rekord: <b>'+Math.max.apply(0,pts.map(function(p){return p.y}))+' kg</b></p>';
  }
  h+='</div>';
  return h;
}
function addW(e){e.preventDefault();var f=e.target,d=f.d.value||TODAY;S.weights=S.weights.filter(function(x){return x.d!==d});S.weights.push({d:d,kg:num(f.kg.value)});save();render()}

var REC={'Redukcja':[
{n:'Owsianka proteinowa z jabłkiem',k:360,p:23,c:59,f:4,i:'50 g płatków owsianych, 150 g skyru, 1 jabłko, cynamon',s:'Zalej płatki gorącą wodą na 5 minut, wmieszaj skyr, dodaj pokrojone jabłko i cynamon.'},
{n:'Omlet ze szpinakiem i fetą',k:270,p:24,c:3,f:16,i:'2 jajka, 2 białka, garść szpinaku, 30 g fety',s:'Roztrzep jajka z białkami, wlej na patelnię, dodaj szpinak i fetę, smaż pod przykryciem 4 minuty.'},
{n:'Kurczak z ryżem i brokułem',k:475,p:43,c:55,f:8,i:'150 g piersi z kurczaka, 60 g ryżu (suchego), 150 g brokułu, 1 łyżeczka oleju',s:'Ugotuj ryż, kurczaka smaż 6–8 minut z każdej strony, brokuł gotuj na parze 5 minut.'},
{n:'Sałatka z tuńczykiem i fasolą',k:350,p:35,c:22,f:12,i:'1 puszka tuńczyka w wodzie, 100 g czerwonej fasoli z puszki, ogórek, pomidor, 1 łyżka oliwy',s:'Odcedź tuńczyka i fasolę, pokrój warzywa, wymieszaj z oliwą, solą i pieprzem.'},
{n:'Twaróg z warzywami i chlebem',k:380,p:40,c:40,f:4,i:'200 g chudego twarogu, rzodkiewki, ogórek, szczypiorek, 2 kromki chleba razowego',s:'Rozgnieć twaróg widelcem, wymieszaj z pokrojonymi warzywami i podaj z chlebem.'}],
'Masa':[
{n:'Owsianka z masłem orzechowym i bananem',k:725,p:28,c:110,f:20,i:'100 g płatków owsianych, 300 ml mleka 2%, 1 banan, 1 łyżka masła orzechowego',s:'Gotuj płatki w mleku 5 minut, dodaj pokrojonego banana i masło orzechowe.'},
